services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tg_pool
      POSTGRES_PASSWORD: tg_pool
      POSTGRES_DB: tg_pool
    ports:
      - "5432:5432"
    volumes:
      - tg_pool_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  tg_pool_pg:
